name: Build, test and pre-release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set development package version
        id: version
        run: |
          base=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD.in)
          version="${base}.r$(git rev-list --count HEAD).g$(git rev-parse --short=12 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ZAP_PKGVER=$version" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Enable sandbox namespaces on the disposable runner
        run: |
          # Ubuntu's host policy otherwise denies bubblewrap's UID mapping in Docker.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build and test in Arch Linux
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env BUILD_UID="$(id -u)" --env ZAP_PKGVER --env SOURCE_DATE_EPOCH --env GITHUB_SHA \
            archlinux:base-devel bash .github/scripts/build-arch.sh

      - name: Save tested build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  pre-release:
    needs: arch
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zap-x86_64
          path: dist

      - name: Publish versioned pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.arch.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tag="v${RELEASE_VERSION}"
          existing=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == false ]]; then
            echo "Pre-release $tag is already published; keeping its original assets."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Automated development build from commit $GITHUB_SHA.

          Includes the x86_64 Arch package, debug symbols, source archive, PKGBUILD, build information and SHA-256 checksums. The build and full test suite passed before publishing.

          Download the main zap package (the debug package is optional), verify it with SHA256SUMS, then install it with:

          \`run0 /usr/bin/pacman -U ./zap-${RELEASE_VERSION}-1-x86_64.pkg.tar.zst\`

          This is a pre-release for Arch Linux, built against its current system libraries.
          NOTES
          if [[ "$existing" != true ]]; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "zap ${RELEASE_VERSION} (pre-release)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease --draft --latest=false
          fi
          # Publish only after every asset has uploaded; interrupted drafts can be retried.
          gh release upload "$tag" ./* --clobber
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
