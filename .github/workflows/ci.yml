name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native dependencies and Zig 0.15.2
        shell: bash
        run: |
          pacman -Syu --noconfirm curl git pkgconf systemd polkit
          curl -fL --proto '=https' --tlsv1.2 https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          echo '02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  /tmp/zig.tar.xz' | sha256sum -c -
          tar -xf /tmp/zig.tar.xz -C /opt
          ln -s /opt/zig-x86_64-linux-0.15.2/zig /usr/local/bin/zig
          useradd -m builder
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check formatting, compile, and test as a normal user
        shell: bash
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # Drop container-root privileges; this does not grant elevated access.
          runuser -u builder -- bash -c 'zig fmt --check build.zig src && zig build -Doptimize=ReleaseSafe && zig build test --summary all'
      - name: Build the distributable Arch package
        shell: bash
        run: |
          runuser -u builder -- bash -c './packaging/source.sh && cd packaging && ZIG=/usr/local/bin/zig makepkg --noconfirm'
